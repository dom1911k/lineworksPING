plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI passes -PappVersionCode / -PappVersionName so each published build gets a
// higher versionCode; local builds default to 1 / "1.0". Computed as plain
// variables here to avoid Groovy parsing `versionCode (expr)` as a method call.
def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
def appVersionName = (project.findProperty('appVersionName') ?: '1.0').toString()

android {
    namespace 'com.dominic.lineworksping'
    compileSdk 34

    defaultConfig {
        applicationId "com.dominic.lineworksping"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // A committed, fixed debug key so every build (CI or local) is signed with the
    // SAME signature. This lets the in-app updater install new APKs over the top
    // instead of Android rejecting them for a signature mismatch.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
